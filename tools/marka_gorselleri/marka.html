<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<!-- Marka görselleri şablonu (Bilgi Kartı yönü). Doğrudan açılmaz: uret.mjs ?k=og|icon|maskable|apple ile çizer. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600..800&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#15181e; --brand:#2f63c9; --text:#eef0f4; --muted:#98a0b0; --red:#ff7b7b; --yellow:#f2c45a; --green:#62d08e; --empty:#2c3240; }
  html,body { margin:0; padding:0; background:transparent; }
  body { font-family:'Atkinson Hyperlegible Next', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  #og { width:1200px; height:630px; position:relative; overflow:hidden; display:none;
        background: radial-gradient(520px 460px at 270px 330px, rgba(47,99,201,.30), rgba(47,99,201,0) 70%), var(--bg); }
  #og .noro { position:absolute; left:70px; top:122px; width:420px; height:420px; }
  #og .mark { position:absolute; left:520px; top:138px; width:84px; height:84px; border-radius:20px; background:var(--brand); }
  #og .mark svg { position:absolute; inset:0; width:84px; height:84px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  #og .name { position:absolute; left:626px; top:112px; font:800 88px/1.1 'Bitter', Georgia, serif; color:var(--text); letter-spacing:0; }
  #og .tag { position:absolute; left:520px; top:258px; font:750 48px/1.25 'Bitter', Georgia, serif; color:var(--text); }
  #og .sub { position:absolute; left:520px; top:392px; font:400 26px/1.3 'Atkinson Hyperlegible Next', sans-serif; color:var(--muted); }
  #og .sq { position:absolute; top:460px; width:40px; height:40px; border-radius:8px; }
  #ic { display:none; position:relative; background:var(--brand); }
  #ic svg { position:absolute; fill:none; stroke:#fff; stroke-linecap:round; stroke-linejoin:round; }
</style></head>
<body>
<div id="og">
  <div class="noro" id="noro"></div>
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 12.5h4l2-5 4 10 2-5h6"/></svg></div>
  <div class="name">PsikoVaka</div>
  <div class="tag">Danışanı dinle,<br>tanıyı bul.</div>
  <div class="sub">Psikoloji öğrencileri için DSM-5-TR vaka oyunu</div>
  <div class="sq" style="left:520px;background:var(--red)"></div>
  <div class="sq" style="left:570px;background:var(--yellow)"></div>
  <div class="sq" style="left:620px;background:var(--yellow)"></div>
  <div class="sq" style="left:670px;background:var(--green)"></div>
  <div class="sq" style="left:720px;background:var(--empty)"></div>
  <div class="sq" style="left:770px;background:var(--empty)"></div>
</div>
<div id="ic"><svg viewBox="0 0 24 24"><path d="M3 12.5h4l2-5 4 10 2-5h6"/></svg></div>
<script src="../../js/avatar.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), k = q.get('k') || 'og', size = +(q.get('size') || 512);
  if (k === 'og') {
    document.getElementById('og').style.display = 'block';
    var A = window.PsikoVakaAvatar;
    document.getElementById('noro').innerHTML = A.render(A.DEFAULT, { size: 420, framed: false, emote: 'wave', title: '' });
  } else {
    var ic = document.getElementById('ic'), svg = ic.firstElementChild;
    ic.style.display = 'block'; ic.style.width = ic.style.height = size + 'px';
    var unit = k === 'maskable' ? 0.0221 : k === 'apple' ? 0.0281 : 0.0309;   // 24 birimlik çizgi → boyutun oranı
    var s = size * unit * 24;
    svg.style.width = svg.style.height = s + 'px';
    svg.style.left = (size - s) / 2 + 'px'; svg.style.top = (size - s) / 2 + 0.5 * size * unit + 'px';
    svg.style.strokeWidth = '1.8';
    if (k === 'icon') ic.style.borderRadius = (size * 0.2) + 'px';
  }
})();
</script></body></html>

# PsikoVaka — sunucu cevap anahtarını Supabase'e otomatik yükler.
#
# Ne yapar: js/cases.js (veya tanı/terapi/ilaç listeleri ya da supabase/seed/) değişip main'e
# push edilince, cevap anahtarını supabase/seed/generate_answer_key.js ile YENİDEN üretir
# (depodaki SQL eski kalmış olsa bile) ve supabase/seed/0002_cases_answer_key.sql dosyasını
# Supabase veritabanına uygular. Güvenle tekrar çalıştırılabilir (upsert; silinen vaka pasif olur).
#
# Ne YAPMAZ: supabase/migrations/*.sql (şema değişiklikleri) burada uygulanmaz; onlar elle,
# gözden geçirilerek SQL Editor'den çalıştırılır.
#
# Gerekli repository secret: SUPABASE_DB_URL = Supabase "Connect" penceresindeki Session pooler
# bağlantı dizesi (GitHub runner'ları yalnızca IPv4; doğrudan bağlantı IPv6 olduğu için çalışmaz).
# Kurulum: supabase/README.md -> "GitHub'a veritabanı bağlantısını tanıtma".

name: Supabase cevap anahtari

on:
  push:
    branches: [main]
    paths:
      - js/cases.js
      - js/diagnoses.js
      - js/therapies.js
      - js/pharmacology.js
      - supabase/seed/**
      - .github/workflows/supabase-cevap-anahtari.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-cevap-anahtari
  cancel-in-progress: false

jobs:
  cevap-anahtari:
    name: Cevap anahtarini Supabase'e yukle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Secret kontrolu / Check secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error title=SUPABASE_DB_URL eksik / missing::Depoda SUPABASE_DB_URL secret'i tanimli degil. supabase/README.md 'GitHub'a veritabani baglantisini tanitma' bolumune bakin. Cevap anahtari Supabase'e YUKLENMEDI. / Repository secret SUPABASE_DB_URL is not set; the answer key was NOT uploaded. See supabase/README.md."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *YOUR-PASSWORD*|*'[YOUR'*)
              echo "::error title=Sifre yer tutucusu / Password placeholder::SUPABASE_DB_URL icinde hala [YOUR-PASSWORD] yazıyor; gercek veritabani sifresini koyun. / SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder."
              exit 1 ;;
            *db.*.supabase.co*)
              echo "::warning title=Dogrudan baglanti / Direct connection::Bu dize dogrudan (direct) baglantiya benziyor; GitHub runner'lari IPv4 oldugu icin baglanamayabilir. Connect penceresinden Session pooler dizesini kullanin. / Looks like a direct connection string (IPv6); use the Session pooler string." ;;
          esac
          echo "SUPABASE_DB_URL tanimli / is set."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cevap anahtarini uret / Generate answer key
        run: |
          node supabase/seed/generate_answer_key.js
          if ! git diff --quiet -- supabase/seed/0002_cases_answer_key.sql; then
            echo "::notice::Depodaki 0002_cases_answer_key.sql eskiydi; yeniden uretilen surum uygulanacak. / Committed SQL was stale; the regenerated file is applied."
          fi

      - name: psql hazirla / Ensure psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Sema kontrolu / Check schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ok=$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -c \
            "select (to_regclass('public.cases_answer_key') is not null and to_regclass('public.answer_catalog') is not null)::text")
          if [ "$ok" != "true" ]; then
            echo "::error title=Sema yok / Schema missing::Supabase'de public.cases_answer_key / public.answer_catalog tablolari yok. Once supabase/migrations/0001_init.sql dosyasini SQL Editor'de elle calistirin. / Run supabase/migrations/0001_init.sql manually first."
            exit 1
          fi

      # Dosya kendi begin ... commit blogunu iceriyor (SQL Editor'de elle calistirma icin de tek islem).
      # Bu yuzden --single-transaction kullanilmiyor (psql belgeleri: betik BEGIN/COMMIT iceriyorsa
      # bu secenek beklenen etkiyi vermez). ON_ERROR_STOP=1 ile ilk hatada psql durur, acik islem geri alinir.
      - name: Supabase'e uygula / Apply to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/seed/0002_cases_answer_key.sql

      - name: Dogrulama / Verify counts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          expected=$(node -e "const {CLINICAL_CASES}=require('./js/cases.js');console.log(CLINICAL_CASES.length)")
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "
            select (select count(*) from public.cases_answer_key where is_active)     as aktif_vaka,
                   (select count(*) from public.cases_answer_key where not is_active) as pasif_vaka,
                   (select count(*) from public.answer_catalog)                       as katalog_ogesi;"
          active=$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -c "select count(*) from public.cases_answer_key where is_active")
          echo "js/cases.js: $expected vaka | Supabase aktif vaka: $active"
          if [ "$active" != "$expected" ]; then
            echo "::error::Aktif vaka sayisi ($active) js/cases.js ile ($expected) uyusmuyor. / Active case count mismatch."
            exit 1
          fi
          echo "### Cevap anahtari yuklendi: $active aktif vaka" >> "$GITHUB_STEP_SUMMARY"
